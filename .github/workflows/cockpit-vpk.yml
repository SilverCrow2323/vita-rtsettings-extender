name: Rt Vita Cockpit VPK

on:
  push:
    branches:
      - feat/tai-saver-core
    paths:
      - "cockpit/**"
      - "include/plugin_inventory.h"
      - "include/plugin_compatibility.h"
      - "settings-ui/plugin_control_centre.*"
      - "source/plugin-inventory/**"
      - "source/plugin-compatibility/**"
      - "native-settings/**"
      - "include/tai_config.h"
      - "source/tai-config/**"
      - "include/tai_saver.h"
      - "include/rt_fs.h"
      - "source/tai-saver/**"
      - "source/platform/rt_fs.c"
      - ".github/workflows/cockpit-vpk.yml"
  pull_request:
    paths:
      - "cockpit/**"
      - "include/plugin_inventory.h"
      - "include/plugin_compatibility.h"
      - "settings-ui/plugin_control_centre.*"
      - "source/plugin-inventory/**"
      - "source/plugin-compatibility/**"
      - "native-settings/**"
      - "include/tai_saver.h"
      - "include/rt_fs.h"
      - "source/tai-saver/**"
      - "source/platform/rt_fs.c"
      - ".github/workflows/cockpit-vpk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vpk:
    name: Build, inspect and package Rt Vita Cockpit VPK
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Cockpit and native Settings SUPRX
        run: make -C cockpit clean all
      - name: Inspect VPK payload and calculate checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import struct
          import zipfile
          from pathlib import Path

          vpk = Path("cockpit/rt-vita-cockpit.vpk")
          assert vpk.is_file() and vpk.stat().st_size > 0, "VPK missing or empty"
          with zipfile.ZipFile(vpk) as archive:
              names = set(archive.namelist())
              required = {"eboot.bin", "param.sfo", "rtsettings.suprx"}
              missing = required - names
              assert not missing, f"Missing VPK entries: {sorted(missing)}"
              eboot = archive.read("eboot.bin")
              sfo = archive.read("param.sfo")
              suprx = archive.read("rtsettings.suprx")
          assert eboot and suprx, "Empty EBOOT or SUPRX payload"
          assert sfo[:4] == b"\x00PSF", "Invalid PARAM.SFO magic"
          key_table, data_table, count = struct.unpack_from("<III", sfo, 8)
          title_id = None
          for index in range(count):
              key_offset, fmt, length, max_length, data_offset = struct.unpack_from(
                  "<HHIII", sfo, 0x14 + index * 16
              )
              key = sfo[key_table + key_offset:].split(b"\x00", 1)[0]
              if key == b"TITLE_ID":
                  raw = sfo[data_table + data_offset:data_table + data_offset + length]
                  title_id = raw.split(b"\x00", 1)[0].decode("ascii")
                  break
          assert title_id == "RTV000001", f"Unexpected TITLE_ID: {title_id!r}"
          vpk_hash = hashlib.sha256(vpk.read_bytes()).hexdigest()
          suprx_hash = hashlib.sha256(suprx).hexdigest()
          report = (
              f"VPK: {vpk}\n"
              f"Title ID: {title_id}\n"
              f"VPK bytes: {vpk.stat().st_size}\n"
              f"EBOOT bytes: {len(eboot)}\n"
              f"SUPRX bytes: {len(suprx)}\n"
              f"VPK SHA-256: {vpk_hash}\n"
              f"SUPRX SHA-256: {suprx_hash}\n"
              "Required entries: eboot.bin, param.sfo, rtsettings.suprx\n"
              "Inspection: PASS\n"
          )
          Path("cockpit/vpk-inspection.txt").write_text(report, encoding="utf-8")
          Path("cockpit/rt-vita-cockpit.vpk.sha256").write_text(
              f"{vpk_hash}  rt-vita-cockpit.vpk\n", encoding="ascii"
          )
          print(report, end="")
          PY
      - name: Upload verified VPK and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: rt-vita-cockpit-settings-audit-vpk
          path: |
            cockpit/rt-vita-cockpit.vpk
            cockpit/rt-vita-cockpit.vpk.sha256
            cockpit/vpk-inspection.txt
          if-no-files-found: error
